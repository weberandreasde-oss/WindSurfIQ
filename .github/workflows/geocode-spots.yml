name: Surfspot-Kandidaten geokodieren
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  geocode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Mehrstufige Standortsuche
        run: python geocode_spots.py 60
      - name: Ergebnisse sichern
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add geocode_cache.json spot_kandidaten_geocodiert.csv
          git diff --cached --quiet || (git commit -m 'Mehrstufige Geokodierung Surfspot-Kandidaten' && git push)
