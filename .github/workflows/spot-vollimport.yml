name: Spot-Vollimport DE FR NL
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python import_spots.py
      - uses: actions/upload-artifact@v4
        with:
          name: Surfspots-Quellenlisten
          path: |
            spots_alle_quellen_roh.csv
            spots_nur_exakte_dubletten_entfernt.csv
            dubletten_entfernt.csv
            importbericht.json
